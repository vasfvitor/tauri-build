name: build-variant

# Reusable workflow: one Tauri build with every optimisation knob exposed as
# an input. Called by experiments.yml for each entry of experiments/matrix.json.
#
# Two apps can be built: the benchmark app in app/ (default) and the `api`
# example of tauri-apps/plugins-workspace, a real monorepo where the plugins
# are path crates of the same Cargo workspace.
on:
  workflow_call:
    inputs:
      name:            { type: string,  required: true }
      os:              { type: string,  required: true }
      rep:             { type: string,  default: "1" }           # repetition index; also part of every cache key, so repeats never share or clobber a cache
      app:             { type: string,  default: "bench" }       # bench | plugins-api
      app_ref:         { type: string,  default: "" }            # plugins-api only: git ref of tauri-apps/plugins-workspace ("" = the commit pinned below)
      cache:           { type: string,  default: "none" }        # none | swatinem | swatinem-ws | sccache | swatinem+sccache | actions-cache
      linker:          { type: string,  default: "default" }     # default | lld | mold
      toolchain:       { type: string,  default: "stable" }      # stable | nightly | 1.xx
      cargo_profile:   { type: string,  default: "release" }     # release | fast
      lto:             { type: string,  default: "" }            # "" | off | thin | fat | true | false
      codegen_units:   { type: string,  default: "" }
      opt_level:       { type: string,  default: "" }
      panic:           { type: string,  default: "" }            # "" | unwind | abort
      incremental:     { type: string,  default: "" }            # "" | true | false
      debug:           { type: string,  default: "" }            # "" | 0 | 1 | 2 | line-tables-only
      rustflags_extra: { type: string,  default: "" }
      bundles:         { type: string,  default: "" }            # "" (tauri default) | none | deb | appimage | rpm | app | dmg | nsis | msi
      features:        { type: string,  default: "" }            # e.g. heavy | big | heavy,big
      target:          { type: string,  default: "" }            # e.g. aarch64-apple-darwin
      pnpm_cache:      { type: string,  default: "true" }
      change:          { type: string,  default: "none" }        # none | app | deps : what "changed since the last build" (applied before building)
      cache_salt:      { type: string,  default: "" }            # mixed into every cache key; a fresh value makes the run truly cold
      runs:            { type: string,  default: "1" }           # build N times in the same job (run 2+ touches app code first)
      run_id_tag:      { type: string,  default: "" }            # free text that ends up in the timing JSON

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  build:
    name: ${{ inputs.name }} / ${{ inputs.os }} #${{ inputs.rep }}
    runs-on: ${{ inputs.os }}
    defaults:
      run:
        shell: bash
        # Every step runs inside the app's frontend directory, next to src-tauri/.
        working-directory: ${{ inputs.app == 'plugins-api' && 'plugins-workspace/examples/api' || 'app' }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout tauri-apps/plugins-workspace
        if: inputs.app == 'plugins-api'
        uses: actions/checkout@v4
        with:
          repository: tauri-apps/plugins-workspace
          ref: ${{ inputs.app_ref || '0850317b5c85092cbf4ea9caf4ef3a9c771fcf27' }}
          path: plugins-workspace

      - name: Start clock, resolve app paths
        env:
          IN_APP: ${{ inputs.app }}
        run: |
          echo "T_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          echo "NCPU=$(nproc 2>/dev/null || sysctl -n hw.ncpu)" >> "$GITHUB_ENV"
          # Paths relative to the repository root (for the cache actions) and to
          # the app directory (for the shell steps).
          case "$IN_APP" in
            bench)
              WS_DIR=app/src-tauri; PNPM_ROOT=app; REPO_REL=..; TARGET_REL=src-tauri/target; LOCK_REL=src-tauri/Cargo.lock; BIN_NAME=bench-app ;;
            plugins-api)
              WS_DIR=plugins-workspace; PNPM_ROOT=plugins-workspace; REPO_REL=../../..; TARGET_REL=../../target; LOCK_REL=../../Cargo.lock; BIN_NAME=api ;;
            *) echo "unknown app: $IN_APP" >&2; exit 1 ;;
          esac
          {
            echo "WS_DIR=$WS_DIR"; echo "PNPM_ROOT=$PNPM_ROOT"; echo "REPO_REL=$REPO_REL"
            echo "TARGET_REL=$TARGET_REL"; echo "LOCK_REL=$LOCK_REL"; echo "BIN_NAME=$BIN_NAME"
          } >> "$GITHUB_ENV"

      # ---------- system deps ----------
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          t0=$(date +%s)
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libxdo-dev libssl-dev pkg-config
          echo "T_SYSDEPS=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"

      # ---------- toolchains ----------
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.toolchain }}
          targets: ${{ inputs.target }}

      - name: Linker (lld)
        if: inputs.linker == 'lld'
        run: |
          # On Linux we go through clang; on Windows rust-lld ships with the toolchain.
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y -qq lld clang
            echo "RUSTFLAGS_LINKER=-C linker=clang -C link-arg=-fuse-ld=lld" >> "$GITHUB_ENV"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            echo "RUSTFLAGS_LINKER=-C linker=rust-lld.exe" >> "$GITHUB_ENV"
          fi

      - name: Linker (mold)
        if: inputs.linker == 'mold'
        uses: rui314/setup-mold@v1
        with:
          make-default: false
      - name: Linker (mold) flags
        if: inputs.linker == 'mold'
        # rustc >= 1.90 links through its bundled rust-lld and never calls the
        # system `ld`, so the setup-mold symlink alone would change nothing.
        run: |
          sudo apt-get install -y -qq clang
          echo "RUSTFLAGS_LINKER=-C linker=clang -C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          # plugins-workspace pins its pnpm in package.json (packageManager).
          version: ${{ inputs.app == 'plugins-api' && '12.3.4' || '10' }}
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ inputs.pnpm_cache == 'true' && 'pnpm' || '' }}
          cache-dependency-path: ${{ env.PNPM_ROOT }}/pnpm-lock.yaml

      # ---------- caches ----------
      - name: Cache (Swatinem/rust-cache)
        if: contains(inputs.cache, 'swatinem')
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.WS_DIR }} -> target
          # Key on the variant so profile/linker changes don't poison each other,
          # and on the salt so a new batch of runs starts from a cold cache.
          key: ${{ inputs.name }}-${{ inputs.target }}-${{ inputs.cache_salt }}-r${{ inputs.rep }}
          cache-on-failure: true
          # By default rust-cache drops every workspace crate from the cache, so
          # a monorepo like plugins-workspace recompiles all its plugins on every
          # warm run. `swatinem-ws` keeps them.
          cache-workspace-crates: ${{ contains(inputs.cache, 'swatinem-ws') }}

      - name: Cache (sccache)
        if: contains(inputs.cache, 'sccache')
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Enable sccache
        if: contains(inputs.cache, 'sccache')
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          # Namespace the sccache entries per experiment; the GHA backend is
          # otherwise shared by every job in the repository.
          echo "SCCACHE_GHA_VERSION=${{ inputs.name }}-${{ inputs.cache_salt }}-r${{ inputs.rep }}" >> "$GITHUB_ENV"
          # sccache cannot cache incremental artifacts
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"

      - name: Cache (plain actions/cache on ~/.cargo + target)
        if: inputs.cache == 'actions-cache'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ env.WS_DIR }}/target
          key: ${{ runner.os }}-${{ inputs.name }}-${{ inputs.cache_salt }}-r${{ inputs.rep }}-${{ hashFiles(format('{0}/Cargo.lock', env.WS_DIR)) }}
          restore-keys: ${{ runner.os }}-${{ inputs.name }}-${{ inputs.cache_salt }}-r${{ inputs.rep }}-

      # ---------- profile knobs (env beats editing Cargo.toml: source stays identical) ----------
      - name: Export profile overrides
        env:
          IN_PROFILE: ${{ inputs.cargo_profile }}
          IN_LTO: ${{ inputs.lto }}
          IN_CGU: ${{ inputs.codegen_units }}
          IN_OPT: ${{ inputs.opt_level }}
          IN_PANIC: ${{ inputs.panic }}
          IN_INCR: ${{ inputs.incremental }}
          IN_DEBUG: ${{ inputs.debug }}
          IN_RUSTFLAGS: ${{ inputs.rustflags_extra }}
        run: |
          P="CARGO_PROFILE_$(echo "$IN_PROFILE" | tr a-z A-Z)"
          [ -n "$IN_LTO" ]   && echo "${P}_LTO=$IN_LTO"           >> "$GITHUB_ENV"
          [ -n "$IN_CGU" ]   && echo "${P}_CODEGEN_UNITS=$IN_CGU" >> "$GITHUB_ENV"
          [ -n "$IN_OPT" ]   && echo "${P}_OPT_LEVEL=$IN_OPT"     >> "$GITHUB_ENV"
          [ -n "$IN_PANIC" ] && echo "${P}_PANIC=$IN_PANIC"       >> "$GITHUB_ENV"
          [ -n "$IN_INCR" ]  && echo "${P}_INCREMENTAL=$IN_INCR"  >> "$GITHUB_ENV"
          [ -n "$IN_DEBUG" ] && echo "${P}_DEBUG=$IN_DEBUG"       >> "$GITHUB_ENV"
          # rust-cache exports CARGO_INCREMENTAL=0, which overrides the profile
          # setting; re-enable it explicitly when the experiment asks for it.
          [ "$IN_INCR" = "true" ] && echo "CARGO_INCREMENTAL=1" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=${RUSTFLAGS_LINKER:-} $IN_RUSTFLAGS" >> "$GITHUB_ENV"

      # ---------- frontend ----------
      - name: pnpm install
        # Inside a pnpm workspace this installs every package of the workspace.
        run: |
          t0=$(date +%s)
          pnpm install --frozen-lockfile
          echo "T_PNPM=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"

      - name: Generate icons
        if: inputs.app == 'bench'
        run: pnpm tauri icon src-tauri/app-icon.png

      - name: Build the plugin JS packages (plugins-workspace)
        if: inputs.app == 'plugins-api'
        # The example imports the plugins' JS through workspace links, which
        # resolve to each plugin's dist-js/. Recorded on its own (js_packages):
        # `tauri build` reruns only the Vite build, so this must stay out of
        # the frontend number the bundling estimate subtracts.
        run: |
          t0=$(date +%s)
          pnpm --filter 'api^...' run build
          echo "T_JS=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"

      - name: Frontend build (timed separately)
        # `tauri build` runs `pnpm build` again through beforeBuildCommand; the
        # second run is fully cached by Vite/tsc, so this gives a clean number.
        run: |
          t0=$(date +%s)
          pnpm build
          echo "T_FRONTEND=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"

      # ---------- simulate "what changed since the cached build" ----------
      - name: Apply change scenario
        env:
          IN_CHANGE: ${{ inputs.change }}
        run: |
          case "$IN_CHANGE" in
            none) ;;
            app)
              printf '\n// change scenario: app (%s)\npub fn perturb_%s() -> u64 { %s }\n' \
                "$GITHUB_RUN_ID" "$GITHUB_RUN_ID" "$GITHUB_RUN_ID" >> src-tauri/src/lib.rs ;;
            deps)
              # Adds a mid-sized crate: Cargo.lock changes, lockfile-keyed caches miss.
              cargo add chrono@0.4 --manifest-path src-tauri/Cargo.toml
              printf '\n// change scenario: deps (%s)\npub fn perturb_%s() -> String { chrono::Utc::now().to_rfc3339() }\n' \
                "$GITHUB_RUN_ID" "$GITHUB_RUN_ID" >> src-tauri/src/lib.rs ;;
            *) echo "unknown change scenario: $IN_CHANGE" >&2; exit 1 ;;
          esac

      # ---------- the build (possibly repeated) ----------
      - name: cargo tauri build
        id: build
        env:
          IN_TARGET: ${{ inputs.target }}
          IN_FEATURES: ${{ inputs.features }}
          IN_BUNDLES: ${{ inputs.bundles }}
          IN_PROFILE: ${{ inputs.cargo_profile }}
          IN_RUNS: ${{ inputs.runs }}
        run: |
          ARGS=()
          [ -n "$IN_TARGET" ]   && ARGS+=(--target "$IN_TARGET")
          [ -n "$IN_FEATURES" ] && ARGS+=(--features "$IN_FEATURES")
          case "$IN_BUNDLES" in
            "")   ;;
            none) ARGS+=(--no-bundle) ;;
            *)    ARGS+=(--bundles "$IN_BUNDLES") ;;
          esac
          CARGO_ARGS=(--timings)
          [ -f "$LOCK_REL" ] && CARGO_ARGS+=(--locked)
          [ "$IN_PROFILE" != "release" ] && CARGO_ARGS+=(--profile "$IN_PROFILE")

          mkdir -p "$REPO_REL/timings"
          for i in $(seq 1 "$IN_RUNS"); do
            if [ "$i" -gt 1 ]; then
              # Touch app code so build #i measures an app-crate rebuild, not a
              # cargo freshness no-op.
              printf '\n// rebuild marker %s\n' "$i" >> src-tauri/src/lib.rs
            fi
            t0=$(date +%s)
            pnpm tauri build "${ARGS[@]}" -- "${CARGO_ARGS[@]}"
            echo "T_BUILD_$i=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"
            # cargo's own wall time, from the --timings report
            HTML=$(ls "$TARGET_REL/cargo-timings/cargo-timing.html" 2>/dev/null || true)
            if [ -n "$HTML" ]; then
              cp "$HTML" "$REPO_REL/timings/${{ inputs.name }}--${{ inputs.os }}--${{ inputs.rep }}.run$i.cargo-timing.html"
              echo "T_CARGO_$i=$(grep -o 'Total time:</td><td>[0-9.]*' "$HTML" | head -1 | sed 's/.*<td>//; s/\..*//')" >> "$GITHUB_ENV"
            fi
          done

      - name: sccache stats
        if: contains(inputs.cache, 'sccache')
        run: sccache --show-stats

      # ---------- measurements ----------
      - name: Write timing record
        if: always()
        env:
          REC_NAME: ${{ inputs.name }}
          REC_OS: ${{ inputs.os }}
          REC_REP: ${{ inputs.rep }}
          REC_APP: ${{ inputs.app }}
          REC_STATUS: ${{ steps.build.outcome }}
          REC_TAG: ${{ inputs.run_id_tag }}
          REC_CHANGE: ${{ inputs.change }}
          REC_FEATURES: ${{ inputs.features }}
          IN_TARGET: ${{ inputs.target }}
          IN_PROFILE: ${{ inputs.cargo_profile }}
        run: |
          mkdir -p "$REPO_REL/timings"
          TARGET_DIR="$TARGET_REL${IN_TARGET:+/$IN_TARGET}/$IN_PROFILE"
          BIN=""
          for f in "$TARGET_DIR/$BIN_NAME" "$TARGET_DIR/$BIN_NAME.exe"; do [ -f "$f" ] && BIN="$f"; done
          BIN_SIZE=$( [ -n "$BIN" ] && wc -c < "$BIN" || echo 0 )
          BUNDLE_SIZE=$( [ -d "$TARGET_DIR/bundle" ] && du -sk "$TARGET_DIR/bundle" | cut -f1 || echo 0 )
          OUT="$REPO_REL/timings/${REC_NAME}--${REC_OS}--${REC_REP}.json"
          node "$REPO_REL/scripts/record.mjs" \
            --name "$REC_NAME" --os "$REC_OS" --rep "$REC_REP" --app "$REC_APP" --status "$REC_STATUS" --tag "$REC_TAG" \
            --change "$REC_CHANGE" --features "$REC_FEATURES" --ncpu "${NCPU:-0}" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --sysdeps "${T_SYSDEPS:-0}" --pnpm "${T_PNPM:-0}" --js "${T_JS:-0}" --frontend "${T_FRONTEND:-0}" \
            --build1 "${T_BUILD_1:-0}" --build2 "${T_BUILD_2:-0}" \
            --cargo1 "${T_CARGO_1:-0}" --cargo2 "${T_CARGO_2:-0}" \
            --job-total "$(( $(date +%s) - T_JOB_START ))" \
            --binary-bytes "${BIN_SIZE:-0}" --bundle-kbytes "${BUNDLE_SIZE:-0}" \
            > "$OUT"
          cat "$OUT"

      - name: Upload timing record + cargo --timings report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timing--${{ inputs.name }}--${{ inputs.os }}--${{ inputs.rep }}
          path: |
            timings/
            app/src-tauri/Cargo.lock
            plugins-workspace/Cargo.lock
          if-no-files-found: warn
          retention-days: 30
